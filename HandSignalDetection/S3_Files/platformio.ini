[env:esp32s3cam]
platform = espressif32 @ ^6.6.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep

lib_deps =
    https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32.git

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_OV2640
